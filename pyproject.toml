[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniscope"
version = "0.1.0"
description = "Production-oriented hybrid scholarly paper retrieval baseline"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "pgvector>=0.3.6", "pydantic-settings>=2.6", "python-multipart>=0.0.9", "pypdf>=5.0", "requests>=2.32", "jieba>=0.42"]

[project.scripts]
paper-search = "omniscope.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
